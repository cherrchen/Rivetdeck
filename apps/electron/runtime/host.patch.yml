# Electron Host composition: OS directory picking belongs to Main. Keep the
# browse Host backend for apiproxy; Desktop Capabilities supplies the client
# directory flow and other Desktop Client features.
- id: directory-picker
  disabled: true

- id: subprocess
  disabled: true

- insert:
    - id: desktop-network-subprocess
      name: '@dsh-electron/dsh-electron-network-subprocess'
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: desktop-capabilities
      name: '@dsh-electron/dsh-electron-desktop-capabilities'

- id: config-editor
  name: 'cordis:desktop-config-editor'

- id: plugin-manager
  disabled: true

- insert:
    - id: desktop-plugin-manager
      name: 'cordis:desktop-plugin-manager'

- id: hmr
  disabled: false
  isolate:
    profileContext: true
