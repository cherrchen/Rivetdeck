# Electron Host composition: OS directory picking belongs to Main. Keep the
# browse Host backend for apiproxy; Desktop supplies the client directory flow.
# Theme Studio is a required runtime plugin installed from npm
# (`dshElectron.runtimePlugins`); it overlays builtin palettes through
# `ctx.theme.overrideTokens` and registers Settings → General → Themes.
- id: directory-picker
  disabled: true

- id: subprocess
  disabled: true

- insert:
    - id: desktop-network-subprocess
      name: '@dsh-electron/dsh-electron-network-subprocess'
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: desktop-capabilities
      name: '@dsh-electron/dsh-electron-desktop-capabilities'
    - id: theme-studio
      name: '@dsh-electron/dsh-theme-studio'
    - id: desktop-directory-picker
      name: '@dsh-electron/dsh-electron-ui-directory-picker'
    - id: desktop-ui-brand
      name: '@dsh-electron/dsh-electron-ui-brand'
    - id: desktop-ui-network-settings
      name: '@dsh-electron/dsh-electron-ui-network-settings'
    - id: desktop-git
      name: '@dsh-electron/dsh-plugin-git'
