name: Sync upstream

on:
  # Pinned to dsh-v0.1.7-rc.2. Scheduled master merges would pull
  # commits after that tag. Re-enable the cron only after an explicit decision
  # to leave that pin.
  # schedule:
  #   - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      allow_master_sync:
        description: 'Merge upstream/master despite the dsh-v0.1.7-rc.2 pin'
        type: boolean
        default: false

concurrency:
  group: sync-deepseek-ai-deepseek-harness
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    name: Merge upstream into develop and publish Beta
    if: github.event_name == 'workflow_dispatch' && inputs.allow_master_sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Fetch upstream branch and tags
        run: |
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream master --tags --prune
          git fetch origin develop --tags

      - name: Detect upstream changes
        id: upstream
        run: |
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream is already merged into develop."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream has commits to merge into develop."
          fi

      - name: Skip sync when upstream is current
        if: steps.upstream.outputs.changed != 'true'
        run: echo "Upstream is already merged into develop; skipping merge, commits, and release."

      - name: Setup pnpm
        if: steps.upstream.outputs.changed == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Install without postinstall hooks so the pairing merge driver can run during
      # git merge without lefthook pre-merge-commit rejecting an otherwise clean result.
      - name: Install dependencies for pairing merge driver
        if: steps.upstream.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Merge upstream with downstream conflict policy
        if: steps.upstream.outputs.changed == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config merge.ours.driver true
          git config merge.theirs.name 'Upstream-owned files'
          git config merge.theirs.driver 'cp %B %A'
          git config merge.dsh-translation-pairing.name 'DeepSeek Harness bilingual pairing records'
          git config merge.dsh-translation-pairing.driver 'scripts/merge-translation-pairing-driver.sh %O %A %B %P'
          if ! git merge --no-edit upstream/master; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)

            echo "Conflict files:"
            printf ' %s\n' "${conflicts[@]}"

            for file in "${conflicts[@]}"; do
              case "$file" in
                README.md|README.zh.md|README.i18n.yaml|docs/electron/*)
                  git checkout --ours -- "$file"
                  git add "$file"
                  ;;
                .github/workflows/desktop-*.yml|.github/workflows/sync-upstream.yml|scripts/desktop-workflow.spec.ts)
                  git checkout --ours -- "$file"
                  git add "$file"
                  ;;
                AGENTS.md|.github/workflows/*.yml|scripts/ci-workflow.spec.ts)
                  git checkout --theirs -- "$file"
                  git add "$file"
                  ;;
                pnpm-lock.yaml|pnpm-workspace.yaml)
                  git checkout --theirs -- "$file"
                  git add "$file"
                  ;;
                *.i18n.yaml)
                  # Pairing records are regenerated after the other conflict policies
                  # via pnpm run resolve-translation-pairing-conflicts.
                  ;;
                *)
                  git merge --abort || true
                  echo "::error::Upstream merge has unresolved conflicts in $file. Manual resolution is required."
                  exit 1
                  ;;
              esac
            done

            mapfile -t remaining < <(git diff --name-only --diff-filter=U)
            if [ "${#remaining[@]}" -gt 0 ]; then
              for file in "${remaining[@]}"; do
                case "$file" in
                  *.i18n.yaml) ;;
                  *)
                    git merge --abort || true
                    echo "::error::Upstream merge has unresolved conflicts in $file. Manual resolution is required."
                    exit 1
                    ;;
                esac
              done

              echo "Regenerating conflicted pairing records:"
              printf ' %s\n' "${remaining[@]}"
              if ! pnpm run resolve-translation-pairing-conflicts; then
                git merge --abort || true
                echo "::error::Failed to regenerate conflicted .i18n.yaml pairing records. Manual resolution is required."
                exit 1
              fi
            fi

            if ! git diff --cached --quiet || [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                git merge --abort || true
                echo "::error::Upstream merge still has unresolved conflicts after automatic resolution."
                exit 1
              fi
              git commit --no-edit
            fi
          fi

          node apps/electron/scripts/restore-agents-downstream.mjs
          if ! git diff --quiet -- AGENTS.md; then
            git add AGENTS.md
            git commit -m "chore: restore AGENTS.downstream.md reference"
          fi

          node apps/electron/scripts/sync-version.mjs
          # Resolve the merged workspace graph before committing the lockfile.
          pnpm install --no-frozen-lockfile
          if ! git diff --quiet -- apps/electron/package.json pnpm-lock.yaml pnpm-workspace.yaml; then
            git add apps/electron/package.json pnpm-lock.yaml pnpm-workspace.yaml
            git commit -m "chore: follow upstream dependency state"
          fi

          if ! grep -q 'apps/\*' pnpm-workspace.yaml && ! grep -q 'apps/electron' pnpm-workspace.yaml; then
            echo "::error::pnpm workspace no longer includes apps/electron after upstream merge."
            exit 1
          fi
      - name: Prepare Beta release commit
        if: steps.upstream.outputs.changed == 'true'
        id: beta
        run: |
          beta_tag=$(node apps/electron/scripts/next-beta-tag.mjs)
          beta_version="${beta_tag#v}"
          node apps/electron/scripts/set-version.mjs "$beta_version"
          pnpm install --no-frozen-lockfile
          git add apps/electron/package.json pnpm-lock.yaml
          git commit -m "release(electron): $beta_version"
          echo "tag=$beta_tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.upstream.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify synchronized desktop overlay
        if: steps.upstream.outputs.changed == 'true'
        run: |
          pnpm run build
          pnpm --filter @dsh-electron/dsh-electron build
          pnpm --filter @dsh-electron/dsh-electron test

      - name: Push verified Beta commit to develop
        if: steps.upstream.outputs.changed == 'true'
        id: push
        env:
          BEFORE: ${{ github.sha }}
        run: |
          after=$(git rev-parse HEAD)
          if [ "$after" = "$BEFORE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin HEAD:develop
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$after" >> "$GITHUB_OUTPUT"

      - name: Wait for Desktop CI
        if: steps.upstream.outputs.changed == 'true' && steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.push.outputs.sha }}
        run: |
          run_id=""
          for attempt in $(seq 1 60); do
            run_id=$(gh api \
              "repos/${GH_REPO}/actions/workflows/desktop-ci.yml/runs?event=push&branch=develop&per_page=20" \
              | jq -r --arg sha "$HEAD_SHA" \
                '[.workflow_runs[] | select(.head_sha == $sha) | .id] | .[0] // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::Desktop CI did not start for develop commit $HEAD_SHA within five minutes."
            exit 1
          fi
          gh run watch "$run_id" --repo "$GH_REPO" --exit-status

      # Beta releases track upstream integration only. desktop-release.yml runs from
      # the Beta tag push; do not dispatch it here.
      - name: Publish Beta tag
        if: steps.upstream.outputs.changed == 'true' && steps.push.outputs.changed == 'true'
        env:
          BETA_TAG: ${{ steps.beta.outputs.tag }}
        run: |
          git tag -a "$BETA_TAG" -m "Beta desktop release ${BETA_TAG#v}"
          git push origin "refs/tags/$BETA_TAG"
