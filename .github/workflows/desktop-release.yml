name: Desktop release
run-name: Desktop release ${{ github.event.inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (for example v0.1.0-beta.1)
        required: true
        type: string
      version:
        description: Electron package version without the v prefix
        required: true
        type: string
      prerelease:
        description: Publish as a GitHub Pre-Release
        required: true
        default: true
        type: boolean

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: read

env:
  DSH_TELEMETRY_DISABLED: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  validate:
    name: Validate release tag and branch
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      version: ${{ steps.context.outputs.version }}
      prerelease: ${{ steps.context.outputs.prerelease }}
      store_version: ${{ steps.store-version.outputs.version }}
      commit: ${{ steps.context.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Resolve release context
        id: context
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tag="$RELEASE_TAG"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+|-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag $tag does not match the supported desktop release format."
            exit 1
          fi

          if [ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Release checkout must match the exact tag commit."
            exit 1
          fi

          version="${tag#v}"
          prerelease=false
          if [[ "$tag" == *-beta.* || "$tag" == *-rc.* ]]; then prerelease=true; fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$REQUESTED_VERSION" != "$version" ]; then
              echo "::error::Requested version $REQUESTED_VERSION does not match tag version $version."
              exit 1
            fi
            if [ "$REQUESTED_PRERELEASE" != "$prerelease" ]; then
              echo "::error::Requested prerelease value $REQUESTED_PRERELEASE does not match tag $tag."
              exit 1
            fi
          fi

          if [[ "$tag" == *-beta.* ]]; then
            expected_branch=develop
          else
            expected_branch=main
          fi

          git fetch origin "$expected_branch"
          if ! git merge-base --is-ancestor HEAD "origin/$expected_branch"; then
            echo "::error::Tag $tag must point to a commit on $expected_branch."
            exit 1
          fi

          actual=$(node -p "require('./apps/electron/package.json').version")
          if [ "$actual" != "$version" ]; then
            echo "::error::Electron version $actual does not match release version $version"
            exit 1
          fi

          {
            echo "commit=$(git rev-parse HEAD)"
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve Store package version
        id: store-version
        env:
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: echo "version=$(node apps/electron/scripts/store-release-version.mjs "$RELEASE_RUN_NUMBER")" >> "$GITHUB_OUTPUT"

  store-credentials:
    name: Validate Partner Center credentials
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Require Partner Center credentials
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          for name in PARTNER_CENTER_TENANT_ID PARTNER_CENTER_SELLER_ID PARTNER_CENTER_CLIENT_ID PARTNER_CENTER_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure GitHub Actions secret $name for Microsoft Store publishing. See apps/electron/README.md."
              exit 1
            fi
          done

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Require deployed Store dispatcher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node apps/electron/scripts/store-release-queue.mjs check

  store-package:
    name: Qualify Microsoft Store packages
    needs: [validate, store-credentials]
    uses: ./.github/workflows/desktop-store.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      commit: ${{ needs.validate.outputs.commit }}
      release_run_number: ${{ github.run_number }}

  package:
    name: Package ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            arch: x64
            args: --win nsis --x64 --config.nsis.oneClick=false --config.nsis.allowToChangeInstallationDirectory=true
            artifact: windows-x64
            files: |
              dist/electron/*-x64.exe
              dist/electron/*-x64.exe.blockmap
              dist/electron/latest.yml
          - name: Windows ARM64
            runner: windows-11-arm
            arch: arm64
            args: --win nsis --arm64 --config.nsis.oneClick=false --config.nsis.allowToChangeInstallationDirectory=true
            artifact: windows-arm64
            files: |
              dist/electron/*-arm64.exe
              dist/electron/*-arm64.exe.blockmap
              dist/electron/latest.yml
          - name: macOS x64
            runner: macos-15-intel
            arch: x64
            args: --mac dmg zip --x64
            artifact: macos-x64
            files: |
              dist/electron/*-x64.dmg
              dist/electron/*-x64.zip
              dist/electron/*-x64.zip.blockmap
              dist/electron/latest-mac.yml
          - name: macOS ARM64
            runner: macos-15
            arch: arm64
            args: --mac dmg zip --arm64
            artifact: macos-arm64
            files: |
              dist/electron/*-arm64.dmg
              dist/electron/*-arm64.zip
              dist/electron/*-arm64.zip.blockmap
              dist/electron/latest-mac.yml
          - name: Linux x64
            runner: ubuntu-latest
            arch: x64
            args: --linux AppImage deb --x64
            artifact: linux-x64
            files: |
              dist/electron/*.AppImage
              dist/electron/*.deb
              dist/electron/latest-linux*.yml
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            arch: arm64
            args: --linux AppImage deb --arm64
            artifact: linux-arm64
            files: |
              dist/electron/*.AppImage
              dist/electron/*.deb
              dist/electron/latest-linux*.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 1

      - name: Fetch pinned upstream audit baseline
        run: git fetch --depth=1 --no-tags https://github.com/deepseek-ai/deepseek-harness.git refs/tags/dsh-v0.2.0-rc.2:refs/tags/dsh-v0.2.0-rc.2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install GNOME development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build upstream application
        run: pnpm run build

      - name: Compile Electron application
        run: pnpm --filter @dsh-electron/dsh-electron build

      - name: Test Electron runtime
        run: pnpm --filter @dsh-electron/dsh-electron test

      - name: Prepare Core Host executor
        env:
          DSH_ELECTRON_TARGET_ARCH: ${{ matrix.arch }}
          DSH_ELECTRON_TARGET_PLATFORM: ${{ runner.os == 'Windows' && 'win32' || runner.os == 'macOS' && 'darwin' || 'linux' }}
        run: pnpm --filter @dsh-electron/dsh-electron prepare:core

      - name: Prepare Network Runtime
        run: pnpm --filter @dsh-electron/dsh-electron prepare:network-runtime

      - name: Write About build identity
        env:
          RIVETDECK_BUILD: ${{ github.run_number }}
          RIVETDECK_COMMIT: ${{ needs.validate.outputs.commit }}
        run: node apps/electron/scripts/write-build-info.mjs

      - name: Build installer
        run: pnpm --filter @dsh-electron/dsh-electron exec electron-builder ${{ matrix.args }} --publish never

      - name: Smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/electron/*-${{ matrix.arch }}.exe" | Select-Object -First 1 -ExpandProperty FullName
          ./apps/electron/scripts/smoke-windows-installer.ps1 -InstallerPath $installer -Architecture '${{ matrix.arch }}'

      - name: Smoke-test packaged zero-runtime Desktop (macOS)
        if: runner.os == 'macOS'
        run: node apps/electron/scripts/smoke-runtime-setup.mjs "$(find dist/electron -path '*/Contents/MacOS/Rivetdeck' -type f -print -quit)"

      - name: Smoke-test packaged zero-runtime Desktop (Linux)
        if: runner.os == 'Linux'
        run: |
          binary="$(find dist/electron -name rivetdeck -type f -print -quit)"
          sudo chown root:root "$(dirname "$binary")/chrome-sandbox"
          sudo chmod 4755 "$(dirname "$binary")/chrome-sandbox"
          xvfb-run -a node apps/electron/scripts/smoke-runtime-setup.mjs "$binary"

      - uses: actions/upload-artifact@v6
        with:
          name: deepseek-harness-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [validate, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install release metadata dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          pattern: deepseek-harness-*
          path: dist/release-artifacts

      - name: Merge update metadata
        run: node apps/electron/scripts/merge-update-metadata.mjs dist/release-artifacts dist/release

      - name: Write checksums and release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd dist/release
          sha256sum -- * > SHA256SUMS.txt
          cd ../..
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Desktop installers for Rivetdeck ${VERSION} (${RELEASE_TAG}).

          These CI artifacts are unsigned. Verify the downloaded file with \`SHA256SUMS.txt\` before installation.
          EOF

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          prerelease_flag=()
          if [ "$PRERELEASE" = "true" ]; then prerelease_flag+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/release/* \
            --verify-tag \
            --title "Rivetdeck ${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${prerelease_flag[@]}"

  store-enqueue:
    name: Queue Microsoft Store release
    needs: [validate, publish, store-package]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set Store release package version
        shell: pwsh
        env:
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: node apps/electron/scripts/store-release-version.mjs "$env:RELEASE_RUN_NUMBER" --write

      - name: Download qualified x64 package
        uses: actions/download-artifact@v4
        with:
          name: rivetdeck-store-x64
          path: dist/electron-store

      - name: Download qualified ARM64 package
        uses: actions/download-artifact@v4
        with:
          name: rivetdeck-store-arm64
          path: dist/electron-store

      - name: Verify qualified unsigned packages
        shell: pwsh
        env:
          STORE_VERSION: ${{ needs.validate.outputs.store_version }}
        run: |
          foreach ($arch in @('x64', 'arm64')) {
            $package = "dist/electron-store/Rivetdeck-store-$env:STORE_VERSION-$arch.appx"
            ./apps/electron/scripts/verify-windows-store.ps1 -PackagePath $package -Architecture $arch
          }

      - name: Persist qualified Store release request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STORE_VERSION: ${{ needs.validate.outputs.store_version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: node apps/electron/scripts/store-release-queue.mjs enqueue
