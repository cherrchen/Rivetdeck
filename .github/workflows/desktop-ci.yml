name: Desktop CI

on:
  push:
    branches: [develop, main]
    paths:
      - '.github/workflows/desktop-*.yml'
      - 'apps/electron/**'
      - 'apps/cli/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'vendor/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  dependabot:
    name: Electron dependency check
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Electron-only changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA"...HEAD | while IFS= read -r path; do
            case "$path" in
              apps/electron/package.json|pnpm-lock.yaml) ;;
              *) echo "::error file=$path::Dependabot may only update the Electron manifest and lockfile."; exit 1 ;;
            esac
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build upstream application
        run: pnpm run build

      - name: Type-check Electron application
        run: pnpm --filter @dsh-electron/dsh-electron typecheck

      - name: Lint Electron application
        run: pnpm exec tsx scripts/run-oxlint.ts apps/electron

      - name: Compile Electron application
        run: pnpm --filter @dsh-electron/dsh-electron build

      - name: Test Electron runtime
        run: pnpm --filter @dsh-electron/dsh-electron test

      - name: Test live plugin ownership
        run: pnpm --filter @dsh-electron/dsh-electron test:ownership

      - name: Install GNOME development libraries
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libglib2.0-bin gsettings-desktop-schemas

      - name: Test Network Runtime
        run: pnpm --filter @dsh-electron/dsh-electron test:network-runtime

  validate:
    name: Test and compile
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify prepared desktop promotion
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::Desktop promotion pull requests into main must come from develop."
            exit 1
          fi

          cli_version=$(node -p "require('./apps/cli/package.json').version")
          electron_version=$(node -p "require('./apps/electron/package.json').version")
          if [ "$electron_version" != "$cli_version" ]; then
            echo "::error::Electron version $electron_version does not match CLI version $cli_version. Run 'pnpm electron:set-version $cli_version' and 'pnpm install --no-frozen-lockfile' on develop, then commit both files before promotion."
            exit 1
          fi
          if [[ ! "$electron_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Version $electron_version is not an RC or Stable desktop version."
            exit 1
          fi

      - name: Build upstream application
        run: pnpm run build

      - name: Type-check Electron application
        run: pnpm --filter @dsh-electron/dsh-electron typecheck

      - name: Lint Electron application
        run: pnpm exec tsx scripts/run-oxlint.ts apps/electron

      - name: Compile Electron application
        run: pnpm --filter @dsh-electron/dsh-electron build

      - name: Test Electron runtime
        run: pnpm --filter @dsh-electron/dsh-electron test

      - name: Test live plugin ownership
        run: pnpm --filter @dsh-electron/dsh-electron test:ownership

      - name: Install GNOME development libraries
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libglib2.0-bin gsettings-desktop-schemas

      - name: Test Network Runtime
        run: pnpm --filter @dsh-electron/dsh-electron test:network-runtime

  windows-host-startup:
    name: Windows Host startup
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' || github.base_ref == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Core Host executor
        run: pnpm --filter @dsh-electron/dsh-electron prepare:core

      # The supervised Host's stdio wiring is Windows-only behavior: the Linux job
      # never opens the null device or observes console ownership.
      - name: Test supervised Host startup
        env:
          DSH_ELECTRON_CORE_SMOKE: '1'
        run: pnpm exec vitest run apps/electron/tests/runtime.spec.ts

      - name: Test Windows Network Runtime
        run: pnpm --filter @dsh-electron/dsh-electron test:network-runtime

  network-runtime:
    name: ${{ matrix.os }} Network Runtime
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install GNOME development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libglib2.0-bin gsettings-desktop-schemas
      - name: Test native Network Runtime
        run: pnpm --filter @dsh-electron/dsh-electron test:network-runtime

  toolchains:
    name: ${{ matrix.os }} Desktop toolchains
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Desktop toolchains
        run: pnpm --filter @dsh-electron/dsh-electron prepare:toolchains
      - name: Smoke-test Desktop toolchains
        run: pnpm --filter @dsh-electron/dsh-electron smoke:toolchains

  managed-runtime-lifecycle:
    name: ${{ matrix.os }} Optional runtime lifecycle
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test optional runtime lifecycle and UI
        run: pnpm exec vitest run apps/electron/tests/runtime-installer.spec.ts apps/electron/tests/runtime-download.spec.ts apps/electron/tests/runtime-ipc.spec.ts apps/electron/tests/runtime-ui.spec.tsx apps/electron/tests/toolchain-environment.spec.ts apps/electron/tests/toolchain-paths.spec.ts apps/electron/tests/toolchain-shims.spec.ts apps/electron/tests/preferences.spec.ts apps/electron/tests/packaging.spec.ts
      - name: Install GNOME development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libglib2.0-bin gsettings-desktop-schemas
      - name: Build packaged runtime dependencies
        run: pnpm run build
      - name: Build Desktop
        run: pnpm --filter @dsh-electron/dsh-electron build
      - name: Prepare Core executor
        run: pnpm --filter @dsh-electron/dsh-electron prepare:core
      - name: Prepare Network Runtime
        run: pnpm --filter @dsh-electron/dsh-electron prepare:network-runtime
      - name: Package application directory
        run: pnpm --filter @dsh-electron/dsh-electron exec electron-builder --dir --publish never
      - name: Verify Windows deep-path installer lifecycle
        if: runner.os == 'Windows'
        run: |
          pnpm --filter @dsh-electron/dsh-electron exec electron-builder --win nsis --x64 --prepackaged ../../dist/electron/win-unpacked --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Windows NSIS build failed.' }
          $installer = (Get-ChildItem dist/electron -Filter '*.exe' -File | Select-Object -First 1).FullName
          if (-not $installer) { throw 'Windows NSIS installer is missing.' }
          ./apps/electron/scripts/smoke-windows-installer.ps1 -InstallerPath $installer -Architecture x64
      - name: Smoke-test runtime lifecycle and Core plugins (Windows)
        if: runner.os == 'Windows'
        run: |
          node apps/electron/scripts/smoke-runtime-setup.mjs "dist/electron/win-unpacked/DeepSeek Harness.exe" --offline
          node apps/electron/scripts/smoke-runtime-setup.mjs "dist/electron/win-unpacked/DeepSeek Harness.exe" --install
          node apps/electron/scripts/smoke-core-plugins.mjs "dist/electron/win-unpacked/resources/core-runtime/node.exe" "dist/electron/win-unpacked/resources/app"
      - name: Smoke-test runtime lifecycle and Core plugins (macOS)
        if: runner.os == 'macOS'
        run: |
          binary="$(find dist/electron -path '*/Contents/MacOS/DeepSeek Harness' -type f -print -quit)"
          node apps/electron/scripts/smoke-runtime-setup.mjs "$binary" --offline
          node apps/electron/scripts/smoke-runtime-setup.mjs "$binary" --install
          node apps/electron/scripts/smoke-core-plugins.mjs "$binary" "${binary%/MacOS/*}/Resources/app"
      - name: Smoke-test runtime lifecycle and Core plugins (Linux)
        if: runner.os == 'Linux'
        run: |
          binary="$(find dist/electron -name deepseek-harness -type f -print -quit)"
          sudo chown root:root "$(dirname "$binary")/chrome-sandbox"
          sudo chmod 4755 "$(dirname "$binary")/chrome-sandbox"
          xvfb-run -a node apps/electron/scripts/smoke-runtime-setup.mjs "$binary" --offline
          xvfb-run -a node apps/electron/scripts/smoke-runtime-setup.mjs "$binary" --install
          node apps/electron/scripts/smoke-core-plugins.mjs "$binary" "$(dirname "$binary")/resources/app"
